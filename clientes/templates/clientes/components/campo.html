<div class="pessoa-campo pessoa-campo-{{ largura }}">
    <label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}{% if campo.field.required %} *{% endif %}:</label>
    {{ campo }}
    {% if campo.errors %}
        <ul class="errorlist">
            {% for error in campo.errors %}
                <li><strong>{{ error|escape }}</strong></li>
            {% endfor %}
        </ul>
    {% endif %}
</div>
