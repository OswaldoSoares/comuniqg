site_name: Documentação Sistema ComuniQG
theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: orange
      toggle:
        icon: material/weather-night
        name: Modo Escuro
    - scheme: slate
      primary: deep orange
      toggle:
        icon: material/weather-sunny
        name: Modo Claro
  features:
    - content.code.copy

nav:
  - Início: index.md
  - Banco legado: banco-legado.md
  - Padrão visual: padrao-visual.md
  - Módulos:
      - Core:
          - JavaScript (ui.js): core/ui-js.md
          - Tools:
              - core/tools/get_mensagem.md
      - Account:
          - Usuários: account/usuarios.md
          - Models:
              - account/models/AccountManager.md
          - Decorators:
              - account/decorators/administrador_required.md
          - Forms:
              - account/forms/_email_livre.md
              - account/forms/UsuarioForm.md
              - account/forms/NovoUsuarioForm.md
              - account/forms/SenhaUsuarioForm.md
              - account/forms/MinhaSenhaForm.md
              - account/forms/AccountCreationForm.md
              - account/forms/LoginForm.md
          - Facade:
              - account/facade/obter_filtro.md
              - account/facade/obter_id.md
              - account/facade/get_usuarios.md
              - account/facade/create_contexto_usuarios.md
              - account/facade/create_contexto_usuario.md
              - account/facade/create_data_usuarios.md
              - account/facade/create_data_usuario.md
              - account/facade/get_usuario_or_none.md
              - account/facade/_form_usuario.md
              - account/facade/modal_usuario.md
              - account/facade/_resposta_lista.md
              - account/facade/save_usuario.md
              - account/facade/modal_senha.md
              - account/facade/save_senha.md
              - account/facade/alterar_situacao_usuario.md
          - Views:
              - account/views/index_usuarios.md
              - account/views/usuarios_lista.md
              - account/views/usuario_consulta.md
              - account/views/usuario_form.md
              - account/views/usuario_senha.md
              - account/views/usuario_situacao.md
          - HTML data:
              - account/html_data/html_card_usuarios.md
              - account/html_data/html_card_usuario.md
              - account/html_data/html_modal_usuario.md
              - account/html_data/html_modal_senha.md
          - JavaScript: account/javascript.md
      - Clientes e fornecedores:
          - clientes/index.md
          - Facade:
              - clientes/facade/obter_filtro.md
              - clientes/facade/_sem_pontuacao.md
              - clientes/facade/get_pessoas.md
              - clientes/facade/create_contexto_pessoas.md
              - clientes/facade/obter_id.md
              - clientes/facade/_dados_pessoa.md
              - clientes/facade/_contatos.md
              - clientes/facade/_movimento.md
              - clientes/facade/create_contexto_pessoa.md
              - clientes/facade/create_data_pessoas.md
              - clientes/facade/create_data_pessoa.md
              - clientes/facade/get_pessoa_or_none.md
              - clientes/facade/modal_pessoa.md
              - clientes/facade/save_pessoa.md
          - Forms:
              - clientes/forms/preenchido.md
              - clientes/forms/tipo_da_pessoa.md
              - clientes/forms/so_digitos.md
              - clientes/forms/_digito_verificador.md
              - clientes/forms/cnpj_valido.md
              - clientes/forms/cpf_valido.md
              - clientes/forms/formata_cnpj.md
              - clientes/forms/formata_cpf.md
              - clientes/forms/CadastraPessoa.md
          - Views:
              - clientes/views/index_clientes.md
              - clientes/views/pessoas_lista.md
              - clientes/views/pessoa_consulta.md
              - clientes/views/pessoa_form.md
          - HTML data:
              - clientes/html_data/html_card_pessoas.md
              - clientes/html_data/html_card_pessoa.md
              - clientes/html_data/html_modal_pessoa.md
          - JavaScript: clientes/javascript.md

markdown_extensions:
  - tables
  - pymdownx.emoji
  - pymdownx.mark
  - pymdownx.highlight
  - pymdownx.superfences
