<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
    <title>ComuniQG - Login</title>
</head>
<body class="body-login">
    <main class="card-login">
        <a href="{% url 'index_core' %}" class="card-login-logo">
            <img src="{% static 'core/img/logo_txt_branco.png' %}" alt="Logo ComuniQG">
        </a>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <h1 class="card-login-titulo">ÁREA RESTRITA</h1>
            {% if form.non_field_errors %}
                <ul class="errorlist">
                    {% for error in form.non_field_errors %}
                        <li><strong>{{ error|escape }}</strong></li>
                    {% endfor %}
                </ul>
            {% endif %}
            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">{{ form.username.label }}:</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">{{ form.password.label }}:</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-block btn-login">
                <i class="bi bi-box-arrow-in-right"></i> ENTRAR
            </button>
        </form>
    </main>
</body>
</html>
